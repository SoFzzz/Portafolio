<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#BF2424" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" type="image/png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<script>
			// Movimiento: elección guardada del visitante, o la preferencia del sistema.
			try {
				var saved = localStorage.getItem('pf-motion');
				var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
				document.documentElement.dataset.motion = saved || (reduced ? 'off' : 'on');
			} catch (e) {
				document.documentElement.dataset.motion = 'on';
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
